          - text: 本次保留正式目录 56 项，另列 35 项未发布候选：28 项明确使用二楼现有器材，7 项徒手。器材覆盖泡沫轴、弹力带、轻壶铃、药球、跳箱、平衡垫、划船机、滑雪机、雪橇和战绳。划船机与滑雪机的现有低强度热身保留；新增分段动作只做轻阻力技术准备，不做冲刺。泡沫轴短时按需使用，不是必做环节；所有固定带动作需先由教练核实锚点。现有 PREP-24 瑜伽球与 PREP-27 BOSU 球未列入当前二楼清单，仍需现场核实。动作参考包括
