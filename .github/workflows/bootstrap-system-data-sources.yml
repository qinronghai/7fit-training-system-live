name: Bootstrap V14.8 Data Sources

on:
  push:
    branches:
      - refactor/issue-4-split-system-data

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mechanically split and verify runtime data
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/src/manifest.json ]; then
            echo "data/src already bootstrapped; no action required"
            exit 0
          fi

          python -m pip install --quiet pytest beautifulsoup4 jsonschema
          python tools/migrate_system_data_sources.py
          python tools/build_system_data.py --check
          python tools/validate_v148_schema.py
          python -m pytest -q
          for f in tests/*_test.js; do node "$f"; done
          find data js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/src data/system-data.js
          git diff --cached --check
          git commit -m "refactor: split V14 system data domains"
          git push origin HEAD:refactor/issue-4-split-system-data
