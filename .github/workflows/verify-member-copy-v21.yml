name: Verify Member Copy V2.1

on:
  push:
    branches: ["codex/member-copy-v2-1-content"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python tests
        run: |
          python -m pip install --quiet pytest beautifulsoup4 jsonschema
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node tests and syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*_test.js; do node "$f"; done
          find data js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
