name: Inspect V14.7 Chunks
on:
  push:
    branches: ["v147-finalize"]
    paths: [".github/workflows/inspect-chunks.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v147-finalize
      - name: Narrow missing r02 character
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n ' < .bootstrap20/r02.b64 > /tmp/r02
          for n in $(seq 8100 100 9000); do
            h=$(head -c "$n" /tmp/r02 | sha256sum | cut -d' ' -f1)
            echo "prefix-$n=$h"
          done
