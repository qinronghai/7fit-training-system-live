name: Inspect V14.7 Chunks
on:
  push:
    branches: ["v147-finalize"]
    paths: [".github/workflows/inspect-chunks.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v147-finalize
      - name: Print r02 corruption window
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n ' < .bootstrap20/r02.b64 > /tmp/r02
          echo "remote-8560-8640=$(tail -c +8561 /tmp/r02 | head -c 80)"
