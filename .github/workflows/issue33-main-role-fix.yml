name: Issue 33 Main Role Fix

on:
  push:
    branches:
      - feature/issue-33-body-data-contract

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-33-body-data-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize Body spec section order
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/superpowers/specs/2026-09-10-body-data-contract-design.md')
          text = path.read_text(encoding='utf-8')
          main = '''### 7.4 Main Role / Family Target Gate\n\nBody V1 冻结以下硬约束：只要 Candidate 的 `roles` 包含 `PRIMARY` 或 `SECONDARY`，其 `directTargets` 必须至少命中该 Candidate 所属**每一个** Family 的 `primaryTargets`。\n\nV1 的 `roles` 是 Candidate 在 `families` 中共享的合法 Role 集，不做按 Family 隐式角色推断。若同一动作在两个 Family 中的主项职责不同，V1 采用保守的 Family membership 拆分；未来只有真实需求证明必要时，才升级为显式 `rolesByFamily` contract。\n\n'''
          candidate = '''### 7.3 Candidate whitelist\n\nV1 不给全部 243 个 Action 自动打 Body 标签。第一版建立约 **40–60 个经过人工审计的 Body Candidate 白名单**，优先覆盖膝主导、髋铰链/髋伸、单腿、水平/垂直推拉、腿屈伸/腿弯举、臀部孤立、髋外展/内收、后三角/侧平举、二头/三头及必要低疲劳胸背辅助。\n\n候选必须引用现有 `actions` 中真实存在的 Action ID。\n\n'''
          wrong = main + candidate
          right = candidate + main
          if wrong in text:
              text = text.replace(wrong, right, 1)
          elif right not in text:
              raise SystemExit('expected Body 7.3/7.4 blocks not found')
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/superpowers/specs/2026-09-10-body-data-contract-design.md
          if git diff --cached --quiet; then
            echo 'Body spec section order already normalized'
          else
            git commit -m 'docs: order Body candidate and main-role sections'
            git push origin HEAD:feature/issue-33-body-data-contract
          fi
