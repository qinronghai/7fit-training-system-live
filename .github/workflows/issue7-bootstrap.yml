name: Issue 7 explicit tier bootstrap

on:
  push:
    branches: ["refactor/issue-7-explicit-main-tier"]
    paths:
      - "tools/migrate_issue7_explicit_tiers.py"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/issue-7-explicit-main-tier

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Migrate composer main candidates and rebuild runtime
        run: |
          set -euo pipefail
          python tools/migrate_issue7_explicit_tiers.py
          python tools/build_system_data.py
          git diff --check

      - name: Commit mechanical migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/src/composer.json data/system-data.js
          git diff --cached --quiet && exit 0
          git commit -m "refactor: migrate composer candidates to explicit tiers"
          git push origin HEAD:refactor/issue-7-explicit-main-tier
