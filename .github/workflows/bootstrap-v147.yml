name: Bootstrap V14.7 Final

on:
  push:
    branches: ["v147-finalize"]
    paths:
      - ".github/workflows/bootstrap-v147.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: v147-finalize
          fetch-depth: 0

      - name: Reassemble, repair, and verify V14.7 payload
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n ' < .bootstrap20/z00.b64 > /tmp/z00.raw
          head -c 20000 /tmp/z00.raw > /tmp/z00.fixed
          echo "ed5ad2105a5aa6b0751bc87948df07b682f99deb368ab13f2eb9e61bf8e0eec6  /tmp/z00.fixed" | sha256sum -c -

          tr -d '\r\n ' < .bootstrap20/r02.b64 > /tmp/r02.raw
          head -c 8581 /tmp/r02.raw > /tmp/r02.fixed
          printf 'v' >> /tmp/r02.fixed
          tail -c +8582 /tmp/r02.raw >> /tmp/r02.fixed
          test "$(wc -c < /tmp/r02.fixed)" -eq 20000
          echo "73bdd84ce9e5c60fb28c0847d68c6be9c6777a3859c5b3d428c8496ebfe5e28e  /tmp/r02.fixed" | sha256sum -c -

          : > /tmp/v147.b64
          cat /tmp/z00.fixed >> /tmp/v147.b64
          for f in .bootstrap20/z01.b64 .bootstrap20/z02.b64 .bootstrap20/z03.b64 .bootstrap20/z04.b64 .bootstrap20/r00.b64 .bootstrap20/r01.b64; do
            tr -d '\r\n ' < "$f" >> /tmp/v147.b64
          done
          cat /tmp/r02.fixed >> /tmp/v147.b64
          for f in .bootstrap20/r03.b64 .bootstrap20/r04.b64 .bootstrap20/r05.b64 .bootstrap20/r06.b64 .bootstrap20/r07.b64; do
            tr -d '\r\n ' < "$f" >> /tmp/v147.b64
          done

          test "$(wc -c < /tmp/v147.b64)" -eq 242652
          echo "5a4dfbbdcc92c55c7864464d16c38d49bd19510fc7336078307b7a935ff79115  /tmp/v147.b64" | sha256sum -c -
          base64 --decode /tmp/v147.b64 > /tmp/v147.tar.xz
          echo "773906770962018b703091bdf255123505274fc0ed22fae3b61df823e41a713e  /tmp/v147.tar.xz" | sha256sum -c -
          mkdir -p /tmp/v147-stage
          tar -xJf /tmp/v147.tar.xz -C /tmp/v147-stage
          test -f /tmp/v147-stage/7fit-training-system-v14.7/index.html

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Python test suite
        working-directory: /tmp/v147-stage/7fit-training-system-v14.7
        run: |
          python -m pip install --quiet pytest beautifulsoup4
          python -m pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Node runtime tests and syntax checks
        working-directory: /tmp/v147-stage/7fit-training-system-v14.7
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*_test.js; do node "$f"; done
          find data js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Replace migration tree with clean V14.7 source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/v147-stage/7fit-training-system-v14.7/. .
          rm -rf .pytest_cache tests/__pycache__
          touch .nojekyll
          mkdir -p .github/workflows
          cat > .github/workflows/deploy-pages.yml <<'YAML'
          name: Deploy 7Fit Training System

          on:
            push:
              branches: ["master"]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - name: Python tests
                  run: |
                    python -m pip install --quiet pytest beautifulsoup4
                    python -m pytest -q
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                - name: Node runtime and JS syntax
                  shell: bash
                  run: |
                    set -euo pipefail
                    for f in tests/*_test.js; do node "$f"; done
                    find data js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
                - name: Prepare static site
                  run: |
                    mkdir -p _site
                    cp index.html _site/
                    cp -a assets data js _site/
                    touch _site/.nojekyll
                - name: Configure Pages
                  uses: actions/configure-pages@v5
                  with:
                    enablement: true
                - name: Upload Pages artifact
                  uses: actions/upload-pages-artifact@v4
                  with:
                    path: _site

            deploy:
              needs: verify
              runs-on: ubuntu-latest
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              steps:
                - name: Deploy Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          YAML

      - name: Commit finalized V14.7 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "7Fit Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "release: migrate V14.7 FINAL to live mainline"
          git push origin HEAD:v147-finalize
