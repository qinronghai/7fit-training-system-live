name: Issue 27 Runtime Regeneration

on:
  push:
    branches:
      - feature/issue-27-template-registry

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-27-template-registry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate committed runtime bundle
        run: python tools/build_system_data.py
      - name: Commit generated bundle when changed
        run: |
          if git diff --quiet -- data/system-data.js; then
            echo "runtime bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/system-data.js
          git commit -m "build: regenerate runtime for template registry"
          git push origin HEAD:feature/issue-27-template-registry
