name: V14.8 Schema Check

on:
  push:
    branches: ["feature/issue-3-v148-data-schema"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install schema test dependencies
        run: python -m pip install --quiet pytest jsonschema

      - name: Inventory current runtime contract
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          text=Path('data/system-data.js').read_text(encoding='utf-8')
          m=re.search(r"window\.V14_DATA\s*=\s*(\{.*\});\s*$",text,re.S)
          data=json.loads(m.group(1))
          print('TOP_LEVEL_KEYS=',sorted(data.keys()))
          print('ROUTES=',sorted({a.get('route') for a in data['actions'].values() if a.get('route') is not None}))
          print('STATUSES=',sorted({a.get('status') for a in data['actions'].values() if a.get('status') is not None}))
          print('TIERS=',sorted({a.get('tier') for a in data['actions'].values() if a.get('tier') is not None}))
          for status in ['可自动编排','待人工验收','SUPPORT_CANON','CORE_CANON']:
              hit=next((a for a in data['actions'].values() if a.get('status')==status),None)
              print(f'ACTION_KEYS_{status}=',sorted(hit.keys()) if hit else None)
          first_session=next(iter(data['sessions'].items()))
          print('SESSION_SAMPLE_ID=',first_session[0])
          print('SESSION_KEYS=',sorted(first_session[1].keys()))
          print('SESSION_SLOT_KEYS=',sorted(first_session[1]['slots'][0].keys()))
          print('COMPOSER_KEYS=',sorted(data.get('composer',{}).keys()))
          print('CORE_DEMANDS=',sorted(data.get('composer',{}).get('coreDemands',{}).keys()))
          print('SUPPORT_COUNT=',len(data.get('supportIds',[])))
          print('CORE_COUNT=',len(data.get('coreIds',[])))
          print('WARMUP_COUNT=',len(data.get('warmupIds',[])))
          print('WARMUP_DETAIL_KEYS=',sorted(next(iter(data.get('warmupDetails',{}).values())).keys()))
          print('FOAM_COUNT=',len(data.get('foamRollIds',[])))
          print('FOAM_DETAIL_KEYS=',sorted(next(iter(data.get('foamRollDetails',{}).values())).keys()))
          print('ACTION_COUNT=',len(data['actions']))
          print('SESSION_COUNT=',len(data['sessions']))
          PY

      - name: Run V14.8 schema tests
        run: python -m pytest tests/test_v148_schema.py -q
