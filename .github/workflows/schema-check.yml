name: V14.8 Schema Check

on:
  push:
    branches: ["feature/issue-3-v148-data-schema"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install schema test dependencies
        run: python -m pip install --quiet pytest jsonschema

      - name: Inventory current runtime enums
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          text=Path('data/system-data.js').read_text(encoding='utf-8')
          m=re.search(r"window\.V14_DATA\s*=\s*(\{.*\});\s*$",text,re.S)
          data=json.loads(m.group(1))
          actions=data['actions'].values()
          print('ROUTES=',sorted({a.get('route') for a in actions if a.get('route') is not None}))
          print('STATUSES=',sorted({a.get('status') for a in data['actions'].values() if a.get('status') is not None}))
          print('TIERS=',sorted({a.get('tier') for a in data['actions'].values() if a.get('tier') is not None}))
          print('CORE_DEMANDS=',sorted(data.get('composer',{}).get('coreDemands',{}).keys()))
          print('ACTION_COUNT=',len(data['actions']))
          print('SESSION_COUNT=',len(data['sessions']))
          PY

      - name: Run V14.8 schema tests
        run: python -m pytest tests/test_v148_schema.py -q
