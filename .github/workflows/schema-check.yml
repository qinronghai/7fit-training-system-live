name: V14.8 Schema Check

on:
  push:
    branches-ignore: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python regression, build freshness, and schema validation
        run: |
          python -m pip install --quiet pytest beautifulsoup4 jsonschema
          python -m pytest -q
          python tools/build_system_data.py --check
          python tools/validate_v148_schema.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node runtime and JS syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in tests/*_test.js; do node "$f"; done
          find data js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  browser-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp -a assets data js _site/
          touch _site/.nojekyll

      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.63.0
          npx playwright install chromium

      - name: Playwright browser smoke
        run: npx playwright test
