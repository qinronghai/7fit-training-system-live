name: V14.8 Schema Check

on:
  push:
    branches: ["feature/issue-3-v148-data-schema"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install schema test dependencies
        run: python -m pip install --quiet pytest jsonschema

      - name: Inventory current runtime contract
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          text=Path('data/system-data.js').read_text(encoding='utf-8')
          m=re.search(r"window\.V14_DATA\s*=\s*(\{.*\});\s*$",text,re.S)
          data=json.loads(m.group(1))
          first_session=next(iter(data['sessions'].items()))
          print('SESSION_SAMPLE_ID=',first_session[0])
          print('SESSION_SLOT_PAIRS=',[(s.get('slotKey'),s.get('slotName')) for s in first_session[1]['slots']])
          print('SESSION_SLOT_NAMES=',sorted({s.get('slotName') for x in data['sessions'].values() for s in x.get('slots',[]) if s.get('slotName') is not None}))
          print('SESSION_SLOT_SUFFIXES=',sorted({s.get('slotKey','').split('__',1)[1] if '__' in s.get('slotKey','') else s.get('slotKey') for x in data['sessions'].values() for s in x.get('slots',[])}))
          print('OFFICIAL_PRESET_MAP=',repr(data['composer']['officialPresetMap']))
          print('OFFICIAL_PRESET_VALUE_TYPES=',sorted({type(v).__name__ for v in data['composer']['officialPresetMap'].values()}))
          print('LOWER_MODE_SAMPLE=',repr(next(iter(data['composer']['lowerModes'].items()))))
          print('UPPER_MODE_SAMPLE=',repr(next(iter(data['composer']['upperModes'].items()))))
          print('ACTION_CORE_DEMAND_VALUES=',sorted({a.get('coreDemand') for a in data['actions'].values() if a.get('coreDemand')}))
          print('COMPOSER_CORE_DEMAND_KEYS=',sorted(data['composer']['coreDemands'].keys()))
          PY

      - name: Run V14.8 schema tests
        run: python -m pytest tests/test_v148_schema.py -q
